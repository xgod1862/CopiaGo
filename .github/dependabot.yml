# Keeps the SHA-pinned actions in .github/workflows current.
#
# Cargo dependencies are left out on purpose. idevice upgrades need the pinned developer image
# files re-verified, and every dependency change needs cargo-deny and the bundled licenses checked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
