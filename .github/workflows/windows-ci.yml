# Windows tests and packages for CopiaGo. The app depends on Win32, DPAPI and the Windows tray,
# so its full test suite and the Inno Setup build only run on Windows.
#
# Security notes:
# - Uses pull_request, not pull_request_target. Fork pull requests run with a read-only token and
#   no secrets, so untrusted code never gets write access.
# - Installers are built only from code that a maintainer pushed: main, manual runs, and pull
#   requests from branches of this repository. A fork's code is tested but never packaged.
# - Third-party actions are pinned to full commit SHAs. Dependabot keeps them current.
name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      installer:
        description: Build the installer and portable ZIP and upload them as artifacts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  # A new push to a pull request replaces the run in progress. Runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    # Keep this name stable: the main branch ruleset requires this check by name.
    # No path filter on purpose. A required check that never starts leaves pull requests pending.
    name: Windows tests and build
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_INSTALLER: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.installer) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      # Line tables keep file and line numbers in test panics while linking much less debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Covers both the test build and build.ps1's release build for the msvc target.
          workspaces: copiago-rs -> target
          # Pull requests restore main's cache but never save their own, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        working-directory: copiago-rs
        run: cargo test --workspace --locked

      - name: Test native Windows clipboard
        working-directory: copiago-rs
        run: cargo test -p copiago-win --locked clipboard::tests::native_clipboard_round_trip -- --ignored --exact --nocapture

      - name: Check executable size
        # build.ps1 enforces the same budget when packages are built. Fork pull requests skip
        # packaging, so build and check the release executable here instead.
        if: env.BUILD_INSTALLER != 'true'
        working-directory: copiago-rs
        run: |
          cargo build --release --locked --package copiago-app --bin copiago
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed (exit $LASTEXITCODE)." }
          $exe = Get-Item -LiteralPath 'target/release/copiago.exe' -ErrorAction Stop
          $limit = 6000000
          Write-Host "$($exe.Name) is $($exe.Length) bytes. Budget is $limit bytes."
          if ($exe.Length -gt $limit) { throw "$($exe.Name) exceeds the executable size budget." }

      - name: Build installer and portable ZIP
        if: env.BUILD_INSTALLER == 'true'
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            # The runner image lists Inno Setup 6, but images change. Install it only when missing.
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          .\copiago-rs\scripts\build.ps1 -IsccPath $iscc -OutputDir release
          # Testers can compare these hashes with the files they receive.
          "### Packages" >> $env:GITHUB_STEP_SUMMARY
          "Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem release\* -Include *.exe, *.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "- ``$($_.Name)`` SHA-256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload packages
        if: env.BUILD_INSTALLER == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CopiaGo-${{ github.sha }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
