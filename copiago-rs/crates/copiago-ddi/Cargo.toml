[package]
name = "copiago-ddi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
copiago-core = { path = "../copiago-core" }
copiago-win = { path = "../copiago-win" }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
idevice = { version = "=0.1.68", default-features = false, features = ["mobile_image_mounter", "ring", "rsd"] }
plist = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1", default-features = false, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "test-util"] }
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
