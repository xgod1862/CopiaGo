[package]
name = "copiago-poc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Feasibility prototype: CopiaGo clipboard link over iOS 17+ CoreDevice tunnel in Rust"

[dependencies]
# Pinned: idevice breaks its API on every point release before 0.2.
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "tcp",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "xpc",
    "core_device",
    "notification_proxy",
    "remote_pairing",
] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "io-util"] }
plist = { version = "1", default-features = false }
uuid = { version = "1", default-features = false, features = ["v3"] }
mdns-sd = { version = "0.13", default-features = false, features = ["async"], optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[features]
default = ["wifi"]
wifi = ["dep:mdns-sd"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
